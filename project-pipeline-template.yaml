# Staged pipeline with an approval process for production releases.
#
# Approvals are not defined here, but rather tied to the environment. 
#
# This template deploys:
# - To the Test environment on commits to the 'main' or 'feature/*' branches (no approval)
# - To the Prod environment on commits to the 'develop' branch (requires approval)

parameters:
# The full path to the folder containing the project.json file for this pipeline
- name: 'projectPath'
  default: '.'
  type: string

# The name of the folder to deploy the package to.
- name: 'folderName'
  default: ''
  type: string

# Either AutoVersion to generate a build number or CurrentVersion to match the project.json version.
- name: 'versioningStrategy'
  default: 'CurrentVersion'
  type: string

# Not used anymore here — overridden by stage-level values
- name: 'environments'
  default: ''
  type: string

# ------------------ STAGES ------------------

# Stage 1: Build and Pack UiPath project
stages:
- stage: Build
  jobs:
  - job: BuildJob
    pool: Default

    workspace:
      clean: all

    steps:
    - script: |
        echo project path: ${{ parameters.projectPath }}
        echo folder name: ${{ parameters.folderName }}
        echo versioning strategy: ${{ parameters.versioningStrategy }}
        echo environments: ${{ parameters.environments }}
      displayName: 'Log Parameters'

    - task: UiPathInstallPlatform-preview@5

    - task: UiPathPack@5
      inputs:
        versionType: ${{ parameters.versioningStrategy }}
        projectJsonPath: '$(Build.SourcesDirectory)\${{ parameters.projectPath }}'
        orchestratorConnection: 'Uipath'
        outputPath: '$(Build.ArtifactStagingDirectory)\Output'

    - publish: $(Build.ArtifactStagingDirectory)\Output
      artifact: drop

# Stage 2: Deploy to Test (main or feature/* branches, no approvals)
- stage: DeployToTest
  condition: and(
    succeeded('Build'),
    or(
      startsWith(variables['Build.SourceBranchName'], 'main'),
      startsWith(variables['Build.SourceBranchName'], 'feature')
    )
  )
  jobs:
  - job: DeployToTestJob
    pool: Default

    workspace:
      clean: all

    steps:
    - download: current
      artifact: drop

    - task: UiPathInstallPlatform-preview@5

    - task: UiPathDeploy@5
      inputs:
        orchestratorConnection: 'Uipath'
        packagesPath: '$(Pipeline.Workspace)\drop'
        folderName: '${{ parameters.folderName }}'
        environments: 'Test'

# Stage 3: Deploy to Prod (develop branch, requires approval via DevOps environment)
- stage: DeployToProd
  condition: and(
    succeeded('Build'),
    eq(variables['Build.SourceBranchName'], 'develop')
  )
  jobs:
  - deployment: DeployToProdJob
    pool: Default

    workspace:
      clean: all

    environment: Production  # Name of the environment in Azure DevOps

    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: UiPathInstallPlatform-preview@5

          - task: UiPathDeploy@5
            inputs:
              orchestratorConnection: 'Uipath'
              packagesPath: '$(Pipeline.Workspace)\drop'
              folderName: '${{ parameters.folderName }}'
              environments: 'Prod'
