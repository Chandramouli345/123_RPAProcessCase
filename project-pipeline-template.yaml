# Staged pipeline with an approval process for production releases.

parameters:
  - name: projectPath
    type: string
    default: '.'

  - name: folderName
    type: string
    default: ''

  - name: versioningStrategy
    type: string
    default: 'CurrentVersion'

  - name: environments
    type: string
    default: ''

stages:
  - stage: Build
    jobs:
      - job: BuildJob
        pool:
          name: Default  # 👈 Use your self-hosted pool

        workspace:
          clean: all

        steps:
          - script: echo "Building package from path: ${{ parameters.projectPath }}"
            displayName: 'Log Inputs'

          - task: UiPathInstallPlatform-preview@5

          - task: UiPathPack@5
            inputs:
              versionType: ${{ parameters.versioningStrategy }}
              projectJsonPath: '$(Build.SourcesDirectory)\${{ parameters.projectPath }}'
              orchestratorConnection: 'Uipath'
              outputPath: '$(Build.ArtifactStagingDirectory)\Output'

          - publish: '$(Build.ArtifactStagingDirectory)\Output'
            artifact: drop

  - stage: DeployToTest
    condition: and(succeeded(), or(eq(variables['Build.SourceBranchName'], 'main'), startsWith(variables['Build.SourceBranchName'], 'Feature')))
    jobs:
      - job: DeployToTestJob
        pool:
          name: Default

        workspace:
          clean: all

        steps:
          - download: current
            artifact: drop

          - task: UiPathInstallPlatform-preview@5

          - task: UiPathDeploy@5
            inputs:
              orchestratorConnection: 'Uipath'
              packagesPath: '$(Pipeline.Workspace)\drop'
              folderName: '${{ parameters.folderName }}'
              environments: '${{ parameters.environments }}'

  - stage: DeployToProd
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'Develop'))
    jobs:
      - deployment: DeployToProdJob
        environment: 'Production'
        pool:
          name: Default

        workspace:
          clean: all

        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: UiPathInstallPlatform-preview@5

                - task: UiPathDeploy@5
                  inputs:
                    orchestratorConnection: 'Uipath'
                    packagesPath: '$(Pipeline.Workspace)\drop'
                    folderName: '${{ parameters.folderName }}'
                    environments: '${{ parameters.environments }}'
